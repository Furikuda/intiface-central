<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Totally Not Secure Intiface Proxy — Control</title>
  <style>
    :root {
      --bg1:#1b1033; --bg2:#2d1b4e; --accent:#ff3e88; --accent2:#7b5cff;
      --text:#f3eefc; --muted:#b9a9d6; --card:rgba(255,255,255,0.06);
      --border:rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin:0; padding:2rem 1rem; min-height:100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, #3a1d6e 0%, transparent 40%),
        radial-gradient(circle at 100% 10%, #6e1d5a 0%, transparent 45%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      background-attachment: fixed;
    }
    .wrap { max-width: 44rem; margin: 0 auto; }
    h1 {
      margin:0; font-size:1.5rem;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .who { color: var(--muted); margin:.25rem 0 1.2rem; }
    .who b { color: var(--text); }

    .stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem,1fr)); gap:.7rem; }
    .stat {
      background: var(--card); border:1px solid var(--border); border-radius:14px;
      padding:.85rem; text-align:center;
    }
    .stat .val {
      font-size:1.5rem; font-weight:800; line-height:1.1;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .stat .lbl {
      margin-top:.25rem; font-size:.7rem; color:var(--muted);
      text-transform:uppercase; letter-spacing:.06em;
    }

    .live { margin:1.4rem 0; }
    .live .lbl { font-size:.8rem; color:var(--muted); display:flex; justify-content:space-between; }
    .gauge { height:16px; border-radius:999px; background:rgba(0,0,0,.3); overflow:hidden; margin-top:.4rem; }
    .gauge > div {
      height:100%; width:0%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      transition: width .15s ease;
    }

    .device {
      background: var(--card); border:1px solid var(--border); border-radius:16px;
      padding:1.1rem; margin:1rem 0;
    }
    .device h2 { margin:0 0 .6rem; font-size:1.15rem; }
    .actuator { margin:.8rem 0; }
    .actuator label { display:flex; justify-content:space-between; font-size:.85rem; color:#dcd2f2; }
    input[type=range] { width:100%; accent-color: var(--accent); height:1.6rem; }
    .btn {
      padding:.5rem .9rem; border:none; border-radius:10px; cursor:pointer; font-weight:700; color:#fff;
      background: rgba(255,255,255,.12);
    }
    .btn.stop { background: linear-gradient(90deg,#ff5f6d,#ff2e63); }
    .stop-all {
      width:100%; margin-top:.5rem; padding:.85rem; font-size:1.05rem; font-weight:800; color:#fff;
      border:none; border-radius:12px; cursor:pointer;
      background: linear-gradient(90deg,#ff5f6d,#ff2e63); box-shadow:0 8px 24px rgba(255,46,99,.35);
    }
    .status { color: var(--muted); font-size:.85rem; text-align:center; margin-top:1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Totally Not Secure Intiface Proxy</h1>
    <p class="who" id="who">Connecting…</p>

    <div class="stats" id="stats"></div>

    <div class="live">
      <div class="lbl"><span>Live intensity</span><span id="liveval">0%</span></div>
      <div class="gauge"><div id="livebar"></div></div>
    </div>

    <div id="devices"></div>
    <button id="stopall" class="stop-all">⏹ Stop everything</button>
    <p class="status" id="status">Connecting…</p>
  </div>

  <script>
    const sessionId = "{{SESSION_ID}}";
    const proto = location.protocol === "https:" ? "wss" : "ws";
    // Derive the socket path relative to this page so it works under any reverse-proxy
    // base path: this page is served at <base>/control/<sid>; the socket is <base>/socket/<sid>.
    const base = location.pathname.replace(/\/control\/[^/]+\/?$/, "");
    const ws = new WebSocket(`${proto}://${location.host}${base}/socket/${sessionId}`);

    const whoEl = document.getElementById("who");
    const statsEl = document.getElementById("stats");
    const devicesEl = document.getElementById("devices");
    const statusEl = document.getElementById("status");
    const liveBar = document.getElementById("livebar");
    const liveVal = document.getElementById("liveval");

    ws.onopen = () => { statusEl.textContent = "Connected."; };
    ws.onclose = () => { statusEl.textContent = "Disconnected. Reload to reconnect."; };
    ws.onerror = () => { statusEl.textContent = "Connection error."; };

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "devices") renderDevices(msg.devices);
      else if (msg.type === "stats") renderStats(msg.stats);
      else if (msg.type === "error") statusEl.textContent = msg.message;
    };

    function send(obj) { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }
    function clock(s) {
      s = Math.max(0, Math.floor(s || 0));
      const m = Math.floor(s / 60);
      return `${m}:${String(s % 60).padStart(2, "0")}`;
    }
    function pct(x) { return `${Math.round((x || 0) * 100)}%`; }

    function renderStats(s) {
      whoEl.innerHTML = `Controlling as <b>${escapeHtml(s.controller_name || "?")}</b> · session <b>${escapeHtml(s.session_id || "")}</b>`;
      const cards = [
        ["Session", clock(s.duration_seconds)],
        ["Commands", s.commands],
        ["Devices", s.devices],
        ["Active time", clock(s.active_seconds)],
        ["Peak", pct(s.peak_intensity)],
        ["Vibration units", s.vibration_units],
        ["Cmds / min", s.commands_per_minute],
      ];
      statsEl.innerHTML = cards
        .map(([lbl, val]) => `<div class="stat"><div class="val">${val}</div><div class="lbl">${lbl}</div></div>`)
        .join("");
      const cur = s.current_intensity || 0;
      liveBar.style.width = pct(cur);
      liveVal.textContent = pct(cur);
    }

    function renderDevices(devices) {
      devicesEl.innerHTML = "";
      if (!devices.length) {
        devicesEl.innerHTML = "<p>No devices yet. Waiting for one to connect…</p>";
        return;
      }
      for (const device of devices) {
        const card = document.createElement("div");
        card.className = "device";
        const title = document.createElement("h2");
        title.textContent = device.name;
        card.appendChild(title);

        if (!device.actuators.length) {
          const none = document.createElement("p");
          none.textContent = "No controllable actuators.";
          card.appendChild(none);
        }

        for (const actuator of device.actuators) {
          const wrap = document.createElement("div");
          wrap.className = "actuator";
          const label = document.createElement("label");
          const name = document.createElement("span");
          name.textContent = `${actuator.type}${actuator.descriptor ? " — " + actuator.descriptor : ""}`;
          const valSpan = document.createElement("span");
          valSpan.textContent = "0%";
          label.appendChild(name);
          label.appendChild(valSpan);

          const slider = document.createElement("input");
          slider.type = "range";
          slider.min = "0"; slider.max = "1"; slider.step = "0.01"; slider.value = "0";
          slider.oninput = () => {
            valSpan.textContent = pct(parseFloat(slider.value));
            send({ device: device.index, actuator: actuator.index, intensity: parseFloat(slider.value) });
          };
          wrap.appendChild(label);
          wrap.appendChild(slider);
          card.appendChild(wrap);
        }

        const stop = document.createElement("button");
        stop.className = "btn stop";
        stop.textContent = "Stop this device";
        stop.onclick = () => stopDevice(card, device.index);
        card.appendChild(stop);
        devicesEl.appendChild(card);
      }
    }

    function stopDevice(card, index) {
      send({ device: index, stop: true });
      card.querySelectorAll("input[type=range]").forEach((s) => { s.value = "0"; });
      card.querySelectorAll(".actuator label span:last-child").forEach((s) => { s.textContent = "0%"; });
    }

    document.getElementById("stopall").onclick = () => {
      document.querySelectorAll(".device").forEach((card, i) => {
        // device index is stored implicitly; just stop each rendered device
      });
      document.querySelectorAll("input[type=range]").forEach((s) => { s.value = "0"; });
      document.querySelectorAll(".actuator label span:last-child").forEach((s) => { s.textContent = "0%"; });
      send({ stop_all: true });
    };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
  </script>
</body>
</html>
