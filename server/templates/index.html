<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Totally Not Secure Intiface Proxy</title>
  <style>
    :root {
      --bg1:#1b1033; --bg2:#2d1b4e; --accent:#ff3e88; --accent2:#7b5cff;
      --text:#f3eefc; --muted:#b9a9d6;
    }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; padding:2rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, #3a1d6e 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, #6e1d5a 0%, transparent 45%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display:flex; align-items:center; justify-content:center;
    }
    .card {
      width:100%; max-width:30rem; padding:2rem; border-radius:18px;
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.12);
      box-shadow:0 20px 60px rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
    }
    .badge {
      display:inline-block; margin-bottom:1.1rem; padding:.18rem .7rem;
      font-size:.74rem; border-radius:999px; color:#ff9ec4;
      background: rgba(255,62,136,.18); border:1px solid rgba(255,62,136,.4);
    }
    h1 {
      margin:0 0 .35rem; font-size:1.75rem; line-height:1.15;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .tag { color: var(--muted); margin:0 0 1.4rem; font-size:.95rem; }
    label { display:block; margin:1rem 0 .35rem; font-weight:600; font-size:.9rem; }
    input {
      width:100%; padding:.75rem .9rem; font-size:1rem; border-radius:10px;
      color: var(--text); background: rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.15);
    }
    input:focus {
      outline:none; border-color: var(--accent2);
      box-shadow:0 0 0 3px rgba(123,92,255,.3);
    }
    button {
      margin-top:1.6rem; width:100%; padding:.85rem; font-size:1.05rem; font-weight:700;
      color:#fff; border:none; border-radius:12px; cursor:pointer;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      box-shadow:0 8px 24px rgba(255,62,136,.35); transition: transform .08s ease;
    }
    button:hover { transform: translateY(-1px); }
    .error { min-height:1.2em; margin-top:1rem; font-size:.9rem; color:#ff8fb0; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">⚠ no encryption · for testing only</span>
    <h1>Totally Not Secure Intiface Proxy</h1>
    <p class="tag">Punch in the secret words and a name, and you're in control. 🎛️</p>
    <form method="post" action="">
      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="off" placeholder="e.g. Alex" required />
      <label for="session_id">Session ID</label>
      <input id="session_id" name="session_id" autocomplete="off"
             placeholder="word-word-word-word" required />
      <div class="error">{{ERROR}}</div>
      <button type="submit">Connect ✨</button>
    </form>
  </div>
  <script>
    // Prefill the session ID when arriving via a shared link (…/?session=word-word-word-word).
    const session = new URLSearchParams(location.search).get("session");
    if (session) {
      document.getElementById("session_id").value = session;
      document.getElementById("name").focus();
    }
  </script>
</body>
</html>
